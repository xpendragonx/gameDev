<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemonade Stand</title>
<style>
  body { background:#111; color:#ffe14d; font:16px/1.3 monospace; margin:16px; }
  pre { margin:0 0 12px; }
  button { font:inherit; background:#222; color:inherit; border:1px solid #ffe14d; padding:6px 12px; margin:2px; cursor:pointer; }
</style>
<pre id="screen"></pre>
<div id="buttons">
  <button id="squeeze">[s] Squeeze Lemon</button>
  <button id="buy">[b] Buy Lemons</button>
  <button id="auto">[a] Auto Squeezer</button>
  <button id="boost">[u] Improve Squeezers</button>
  <button id="beg">[r] Beg for Lemons</button>
  <button id="mega">[g] Mega Squeezer</button>
  <button id="down">[-] price</button>
  <button id="up">[+] price</button>
  <button id="mkt">[m] marketing</button>
</div>
<script src="market.js"></script>
<script src="view.js"></script>
<script>
  const m = LemonadeMarket, s = m.newState();
  const act = {
    squeeze: () => m.squeeze(s), buy: () => m.buyLemons(s), auto: () => m.buySqueezer(s), boost: () => m.buyBoost(s), mega: () => m.buyMega(s), beg: () => m.begForLemons(s),
    up: () => m.setPrice(s, s.price + 0.01), down: () => m.setPrice(s, s.price - 0.01),
    mkt: () => m.buyMarketing(s),
  };
  for (const id in act) document.getElementById(id).onclick = act[id];
  const keys = { s: 'squeeze', ' ': 'squeeze', b: 'buy', a: 'auto', u: 'boost', g: 'mega', r: 'beg', '+': 'up', '=': 'up', '-': 'down', m: 'mkt' };
  addEventListener('keydown', (e) => { if (keys[e.key]) { e.preventDefault(); act[keys[e.key]](); } });
  const draw = () => { document.getElementById('screen').textContent = LemonadeView.render(s, m); };
  setInterval(() => { m.tick(s); draw(); }, 1000 / m.TICKS_PER_SECOND);
  draw();
</script>
