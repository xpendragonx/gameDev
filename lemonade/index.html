<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemonade Stand</title>
<style>
  body { background:#111; color:#ffe14d; font:16px/1.3 monospace; margin:16px; }
  pre { margin:0 0 12px; }
  button { font:inherit; background:#222; color:inherit; border:1px solid #ffe14d; padding:6px 12px; margin:2px; cursor:pointer; }
</style>
<pre id="screen"></pre>
<button id="down">[-] price</button>
<button id="up">[+] price</button>
<button id="mkt">[m] marketing</button>
<script src="market.js"></script>
<script>
  const m = LemonadeMarket, s = m.newState();
  s.production = 1;
  const bar = (v, max, w = 20) => '#'.repeat(Math.round(Math.min(v / max, 1) * w)).padEnd(w, '.');
  function draw() {
    const f = m.forecast(s.price, { mktLvl: s.mktLvl });
    document.getElementById('screen').textContent = [
      '   ___  LEMONADE STAND',
      '  (o o) cash $' + s.cash.toFixed(2) + '   sold ' + s.sold,
      '',
      ` price   $${s.price.toFixed(2)}`,
      ` demand  ${bar(f.demand, 10)} ${f.demand.toFixed(2)}`,
      ` supply  ${bar(s.production, 10)} ${s.production.toFixed(1)} cups/s made`,
      ` stock   ${bar(s.stock, s.maxStock)} ${s.stock}/${s.maxStock}`,
      '',
      ` expected sales ${f.salesPerSec.toFixed(2)}/s  revenue $${f.revenuePerSec.toFixed(2)}/s`,
      ` sells out price ~$${m.clearingPrice(s.production, { mktLvl: s.mktLvl }).toFixed(2)}`,
      ` marketing lvl ${s.mktLvl}  buy $${m.marketingCost(s.mktLvl)}`,
      '',
      s.stock >= s.maxStock ? ' !! Stock piling up: price too high' :
      s.stock === 0 ? ' !! Sold out: price too low' : '',
    ].join('\n');
  }
  const up = () => m.setPrice(s, s.price + 0.01), down = () => m.setPrice(s, s.price - 0.01);
  document.getElementById('up').onclick = up;
  document.getElementById('down').onclick = down;
  document.getElementById('mkt').onclick = () => m.buyMarketing(s);
  addEventListener('keydown', (e) => {
    if (e.key === '+' || e.key === '=') up();
    if (e.key === '-') down();
    if (e.key === 'm') m.buyMarketing(s);
  });
  setInterval(() => { m.tick(s); draw(); }, 1000 / m.TICKS_PER_SECOND);
  draw();
</script>
