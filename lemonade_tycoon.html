<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lemonade Tycoon ASCII</title>
<style>
  :root{--bg:#0a0f07;--panel:#141b0d;--line:#2f3d1c;--ink:#f4f2c8;--mute:#9aa57a;--accent:#ffe14d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'DejaVu Sans Mono',Menlo,Consolas,'Liberation Mono',monospace}
  header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:12px 16px}
  h1{margin:0;font-size:17px;letter-spacing:1px;color:var(--accent)}
  .ctl{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
  button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .wrap{padding:0 16px 24px;max-width:1500px;margin:0 auto}
  #tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  #tabs button.on{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:700}
  #screen{background:#070b04;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
  #scr{display:inline-block;margin:0;text-align:left;line-height:1.18;white-space:pre;font-family:inherit;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  #msg{margin-top:10px;min-height:22px;color:var(--accent);font-size:14px}
  h3.sec{margin:14px 0 8px;font-size:14px;color:var(--accent)}
  #shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:6px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
  .card h3{margin:0;font-size:14px;color:var(--accent)}
  .card p{margin:0;font-size:12.5px;color:var(--mute);line-height:1.45}
  .card .now{font-size:12px;color:#c8e08a}
  .card.owned{border-color:#6a8f2a}
  .card.unlock{border-color:var(--accent);background:#1c2410}
  .card.soon{opacity:.6}
  small{color:var(--mute)}
  /* palette */
  .t{color:#f4f2c8}.d{color:#58642f}.s{color:#9aa57a}.h{color:#ffe14d}.a{color:#ffe84d}.ad{color:#a8942a}
  .g{color:#7ee05a}.w{color:#58b8ff}.wd{color:#2f6fa0}.j{color:#ffd21f}.y{color:#fff7a0}.m{color:#d9cc5c}
  .p{color:#c18cff}.r{color:#ff6a4a}.k{color:#e8e8e8}.mold{color:#4fd1a0}.rot{color:#d9782b}.twig{color:#c9a46a}
</style>
</head>
<body>
<header>
  <h1 id="title">🍋 LEMONADE TYCOON</h1>
  <div class="ctl"><button id="reset">Reset save</button></div>
</header>
<div class="wrap">
  <div id="tabs"></div>
  <div id="screen"><pre id="scr"></pre></div>
  <div id="msg"></div>
  <h3 class="sec" id="shopT">UPGRADES</h3>
  <div id="shop"></div>
  <p><small>Do the job by hand until you master it, then buy the machine that does it for you. Automated stages keep earning even when you look at another stage.</small></p>
</div>

<script>
'use strict';
const W = 100, H = 28;
const ch = new Array(W * H), co = new Array(W * H);
const scr = document.getElementById('scr');

/* ======================================================================
   CONFIG  —  edit this section to rebalance or add/remove levels
   ----------------------------------------------------------------------
   lv(n, firstCost, growth, fx)
     n          number of levels (change it to add or remove levels)
     firstCost  cost of level 1
     growth     each level costs growth× the previous (rounded)
     fx(i)      effect values for level i (1..n), returned as an object
   You can also write a levels array by hand: [{cost:40, acc:.9}, ...]
   Each upgrade:  base = effect values at level 0.
     needs: 'mastery' -> the stage's mastery bar must be full
            '<id>'    -> that upgrade must be owned
   ====================================================================== */
const lv = (n, c0, g, fx) => Array.from({ length: n }, (_, i) => Object.assign({ cost: Math.round(c0 * Math.pow(g, i)) }, fx(i + 1)));

const STAGES = [
  { id: 'inspect', name: 'INSPECT', title: 'Inspection', unlock: null, automate: 'auto' },
  { id: 'grind',   name: 'GRIND',   title: 'Grinder',    unlock: { cost: 50, needs: 'auto' }, automate: 'g_motor' },
];
const COMING = ['MACERATE', 'PRESS', 'PASTEUR', 'FINAL QC'];    // locked placeholders, not built yet

const UPGRADES = [
  // ---- stage 1: inspection ----
  { id: 'auto', stage: 'inspect', title: '🤖 Auto-Inspector', needs: 'mastery', base: {},
    desc: 'A machine that scans the belt and pulls bad lemons for you. Passive income.',
    levels: [{ cost: 40 }] },
  { id: 'belt', stage: 'inspect', title: '⚙ Faster belt', base: { speed: 5, every: 1 },
    desc: 'More lemons per second: more skill needed by hand, more coins when automated.',
    show: o => `${o.speed.toFixed(1)} cells/s`,
    levels: lv(5, 25, 1.7, n => ({ speed: 5 * (1 + .2 * n), every: 1 / (1 + .2 * n) })) },
  { id: 'optics', stage: 'inspect', title: '🔍 Sharper optics', needs: 'auto', base: { acc: .85 },
    desc: 'Auto-Inspector catches more bad lemons.',
    show: o => `${Math.round(o.acc * 100)}% accuracy`,
    levels: lv(6, 50, 1.7, n => ({ acc: Math.min(.99, .85 + .03 * n) })) },

  // ---- stage 2: grinder ----
  { id: 'g_crank', stage: 'grind', title: '🛠 Smoother crank', base: { zone: 4 },
    desc: 'Widens the sweet spot on the rhythm bar. Great while you are learning.',
    show: o => `sweet spot ±${o.zone}`,
    levels: lv(3, 30, 1.8, n => ({ zone: 4 + n })) },
  { id: 'g_motor', stage: 'grind', title: '⚡ Auto-Grinder motor', needs: 'mastery', base: {},
    desc: 'A motor cranks the grinder for you. Passive income.',
    levels: [{ cost: 100 }] },
  { id: 'g_rpm', stage: 'grind', title: '🔧 Motor speed', needs: 'g_motor', base: { rate: .8 },
    desc: 'More cranks per second.',
    show: o => `${o.rate.toFixed(2)} cranks/s`,
    levels: lv(5, 70, 1.65, n => ({ rate: .8 * (1 + .25 * n) })) },
  { id: 'g_doser', stage: 'grind', title: '🧪 Auto-doser', needs: 'g_motor', base: { boost: 1 },
    desc: 'Enzymes always flowing: permanent bonus on every crank, by hand or motor.',
    show: o => `×${o.boost.toFixed(2)} output`,
    levels: lv(3, 120, 2, n => ({ boost: 1 + .25 * n })) },
];

/* ---------- ASCII engine ---------- */
function clear(){ ch.fill(' '); co.fill(''); }
function put(x, y, s, c = 't'){
  x = Math.floor(x); y = Math.floor(y);
  if (y < 0 || y >= H) return;
  for (let i = 0; i < s.length; i++){
    const xx = x + i;
    if (xx < 0 || xx >= W || s[i] === ' ') continue;
    ch[y * W + xx] = s[i]; co[y * W + xx] = c;
  }
}
function box(x, y, w, h, c = 's', dbl = false){
  const [tl,tr,bl,br,hz,vt] = dbl ? '╔╗╚╝═║' : '┌┐└┘─│';
  put(x, y, tl + hz.repeat(Math.max(0, w - 2)) + tr, c); put(x, y + h - 1, bl + hz.repeat(Math.max(0, w - 2)) + br, c);
  for (let j = 1; j < h - 1; j++){ put(x, y + j, vt, c); put(x + w - 1, y + j, vt, c); }
}
function belt(x1, x2, y, T, speed = 5, c = 's'){
  const sh = Math.floor(T * 6 * (speed / 5));
  for (let x = x1; x <= x2; x++){
    const m = (((x - sh) % 4) + 4) % 4;
    put(x, y, m === 0 ? '›' : '═', c);
    if (m === 2) put(x, y + 1, '·', 'd');
  }
  put(x1 - 1, y, '(', c); put(x2 + 1, y, ')', c);
}
function man(x, y, c = 'k'){ put(x, y, ' O ', c); put(x, y + 1, '/|\\', c); put(x, y + 2, '/ \\', c); }
function blink(T, r = 3){ return Math.floor(T * r) % 2 === 0; }
const esc = c => c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '&' ? '&amp;' : c;
function render(){
  const out = [];
  for (let y = 0; y < H; y++){
    let line = '', cur = null, buf = '';
    for (let x = 0; x < W; x++){
      const c = co[y * W + x] || 't';
      if (c !== cur){ if (buf) line += `<span class="${cur}">${buf}</span>`; cur = c; buf = ''; }
      buf += esc(ch[y * W + x]);
    }
    line += `<span class="${cur}">${buf}</span>`;
    out.push(line);
  }
  scr.innerHTML = out.join('\n');
}
function fit(){
  const wpx = document.getElementById('screen').clientWidth - 20;
  scr.style.fontSize = Math.max(6, Math.min(24, wpx / (W * 0.602))) + 'px';
}
window.addEventListener('resize', fit);

/* ---------- state + generic helpers ---------- */
const KEY = 'lemonTycoon.v2';
const freshState = () => ({
  coins: 0, up: {}, unlocked: { inspect: true }, m: { inspect: { p: 0, done: false }, grind: { p: 0, done: false } },
  sorted: 0, best: 0, grinds: 0, gbest: 0, t: Date.now()
});
let G = freshState();
try {
  let s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (!s){   // migrate a v1 save
    const o = JSON.parse(localStorage.getItem('lemonTycoon.v1') || 'null');
    if (o){ s = freshState(); s.coins = o.coins || 0; s.sorted = o.sorted || 0; s.best = o.best || 0;
      s.m.inspect = { p: o.mastery || 0, done: !!o.mastered }; s.up = { auto: o.auto ? 1 : 0, belt: o.belt || 0, optics: o.opt || 0 }; }
  }
  if (s) { const f = freshState(); G = Object.assign(f, s); G.m = Object.assign(f.m, s.m); G.up = s.up || {}; G.unlocked = Object.assign({ inspect: true }, s.unlocked); }
} catch (e) {}
function save(){ G.t = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(G)); } catch (e) {} }

const defOf = id => UPGRADES.find(u => u.id === id);
const up = id => G.up[id] || 0;
const fx = (id, k) => { const d = defOf(id), l = up(id); return l > 0 ? d.levels[l - 1][k] : d.base[k]; };
const mastered = s => G.m[s].done;
const mult = s => mastered(s) ? 1.5 : 1;
function needsMet(needs){ return !needs ? true : needs === 'mastery' ? null : up(needs) > 0; }
function lockReason(d){
  if (!d.needs) return '';
  if (d.needs === 'mastery') return mastered(d.stage) ? '' : 'Reach 100% mastery first';
  return up(d.needs) > 0 ? '' : 'Needs ' + defOf(d.needs).title.replace(/^\S+\s/, '');
}
let T = 0, view = 'inspect', pops = [], msgT = 0;
function pop(x, y, text, col){ pops.push({ x, y, text, col, t: 0 }); }
function say(s){ document.getElementById('msg').textContent = s; msgT = 7; }
function addMastery(stage, amt){
  const m = G.m[stage]; if (m.done) return;
  m.p = Math.max(0, Math.min(100, m.p + amt));
  if (m.p >= 100){ m.done = true; const d = UPGRADES.find(u => u.stage === stage && u.needs === 'mastery');
    say(`★ MASTERY! ${d ? d.title.replace(/^\S+\s/, '') + ' is now available, and ' : ''}manual play pays ×1.5.`); }
}
function drawMastery(stage, y){
  const m = G.m[stage], n = Math.floor(m.p / 100 * 30);
  put(3, y, 'MASTERY', 'd');
  put(11, y, '[' + '█'.repeat(n) + '░'.repeat(30 - n) + ']', m.done ? 'h' : 'g');
  put(44, y, m.done ? '★ MASTERED' : Math.floor(m.p) + '%', m.done ? 'h' : 't');
}

/* ======================================================================
   STAGE 1 — INSPECTION
   ====================================================================== */
const X0 = 18, X1 = 82, Y = 12, SCAN = 56;
const BAD = [['mold', '@'], ['rot', '%'], ['leaf', '&'], ['twig', '#']];
const I = { lemons: [], spawnT: 0, combo: 0, zap: 0, id: 0 };
const inspSpeed = () => fx('belt', 'speed'), inspEvery = () => fx('belt', 'every'), inspAcc = () => fx('optics', 'acc');
function inspRate(){ const m = mult('inspect'), a = inspAcc(), lps = 1 / inspEvery(); return lps * (0.6 * m + 0.4 * a * 2 * m - 0.4 * (1 - a) * 2); }
function inspSpawn(x = X0){
  const bad = Math.random() < .4, k = BAD[(Math.random() * BAD.length) | 0];
  I.lemons.push({ id: I.id++, x, bad, kind: bad ? k[0] : 'good', glyph: bad ? k[1] : 'O' });
}
function inspInit(){ I.lemons = []; for (let x = X0 + 4; x < X1 - 4; x += 9) inspSpawn(x); }
function inspExit(l){
  if (!l.bad){ G.coins += mult('inspect'); G.sorted++; return; }
  I.combo = 0; G.coins = Math.max(0, G.coins - 2);
  if (!mastered('inspect')) addMastery('inspect', -3);
  pop(X1 - 2, Y - 1, '-2', 'r');
}
function inspClick(cx, cy){
  let best = null, bd = 1e9;
  for (const l of I.lemons){
    const dx = Math.abs(l.x - cx), dy = Math.abs(Y - cy);
    if (dx <= 2.3 && dy <= 2.6 && dx + dy < bd){ bd = dx + dy; best = l; }
  }
  if (!best) return;
  if (best.bad){
    best.dead = true; I.combo++; G.best = Math.max(G.best, I.combo);
    const gain = Math.round((3 + Math.floor(I.combo / 5)) * mult('inspect'));
    G.coins += gain; pop(best.x, Y - 1, '+' + gain, 'y'); addMastery('inspect', 7);
  } else {
    I.combo = 0; G.coins = Math.max(0, G.coins - 1); addMastery('inspect', -10);
    pop(best.x, Y - 1, '-1 oops', 'r');
  }
}
function inspStep(dt, viewed){
  const auto = up('auto') > 0;
  if (!viewed && !auto) return;                  // an un-automated stage pauses while you are away
  I.spawnT -= dt;
  if (I.spawnT <= 0){ inspSpawn(); I.spawnT = inspEvery() * (.85 + Math.random() * .3); }
  const sp = inspSpeed();
  for (const l of I.lemons){
    l.x += sp * dt;
    if (auto && !l.scanned && l.x >= SCAN){
      l.scanned = true; I.zap = .3;
      if (l.bad && Math.random() < inspAcc()){ l.dead = true; const g = Math.round(2 * mult('inspect')); G.coins += g; pop(l.x, Y - 1, '+' + g, 'y'); }
    }
    if (!l.dead && l.x > X1){ l.dead = true; inspExit(l); }
  }
  I.lemons = I.lemons.filter(l => !l.dead);
  I.zap = Math.max(0, I.zap - dt);
}
function inspDraw(){
  const auto = up('auto') > 0;
  put(3, 2, 'COINS', 'd'); put(9, 2, String(Math.floor(G.coins)).padEnd(7), 'h');
  put(19, 2, 'SORTED', 'd'); put(26, 2, String(G.sorted).padEnd(6), 't');
  put(34, 2, 'COMBO', 'd'); put(40, 2, String(I.combo).padEnd(4), I.combo >= 5 ? 'h' : 't'); put(45, 2, `(best ${G.best})`, 'd');
  put(60, 2, 'BELT', 'd'); put(65, 2, `${inspSpeed().toFixed(1)} c/s`, 't');
  put(76, 2, 'ACCURACY', 'd'); put(85, 2, auto ? Math.round(inspAcc() * 100) + '%' : '--', 't');
  if (auto) put(3, 3, `income ≈ ${inspRate().toFixed(1)} coins/s`, 'g');

  put(2, 8, ' ┌────────────┐', 's'); put(2, 9, ' │ OOOOOOOOOO │┐', 'a'); put(2, 10, ' │ OOOoOOOOOo ││', 'a'); put(2, 11, ' │OOOOOOOOOOOO│┘', 'a');
  put(2, 12, ' └─(O)────(O)─┘', 's'); put(3, 13, 'TRUCK', 'd');
  belt(X0 - 1, X1 + 1, 13, T, inspSpeed());
  box(84, 14, 12, 5, 's'); put(86, 16, 'TRASH', 'd');
  man(30, 5, 'k'); put(26, 4, 'INSPECTOR', 'h');
  if (!auto && blink(T, 3)) put(27, 8, '\\ · · /', 'y');

  if (auto){
    box(SCAN - 8, 3, 17, 6, 'h', true); put(SCAN - 6, 4, 'AUTO-INSPECT', 'h');
    put(SCAN - 4, 5, blink(T, 4) ? '[ ▓▒░ ]' : '[ ░▒▓ ]', 'g'); put(SCAN - 6, 7, 'optics Lv ' + up('optics'), 'd');
    put(SCAN, 9, '║', 's'); put(SCAN, 10, '║', 's');
    if (I.zap > 0){ put(SCAN - 2, 11, '\\ | /', 'y'); put(SCAN - 2, 12, ' ─┼─ ', 'y'); } else put(SCAN, 11, '▼', 'y');
  }
  for (const l of I.lemons){
    if (l.bad) put(l.x, Y, l.glyph, l.kind);
    else put(l.x, Y, 'Oo0o'[(Math.floor(T * 4) + l.id) % 4], 'a');
  }
  put(3, 16, 'BAD:', 'd'); put(8, 16, '@ mold', 'mold'); put(16, 16, '% rot', 'rot'); put(23, 16, '& leaf', 'g'); put(31, 16, '# twig', 'twig');
  put(41, 16, 'GOOD:', 'd'); put(47, 16, 'O', 'a');
  drawMastery('inspect', 18);
  if (!mastered('inspect')){ if (blink(T, 2)) put(3, 20, '>>> CLICK THE BAD LEMONS BEFORE THEY REACH THE END <<<', 'h'); }
  else if (!auto) put(3, 20, 'Auto-Inspector unlocked: buy it below!', 'g');
  else put(3, 20, 'Line running. Upgrade belt and optics for more coins.', 'g');
}

/* ======================================================================
   STAGE 2 — GRINDER  (rhythm crank + enzyme dosing)
   ====================================================================== */
const BX = 30, BW = 41, CEN = 20;               // rhythm bar origin, width, centre cell
const GR = { cur: 0, dir: 1, jam: 0, spin: 0, phase: 0, combo: 0, enzyme: 0, dropT: 0, doseCd: 0, hit: '', hitT: 0, autoT: 0, crankCd: 0 };
const grZone = () => fx('g_crank', 'zone');
const grBoost = () => fx('g_doser', 'boost');
const grRate = () => up('g_motor') > 0 ? fx('g_rpm', 'rate') : 0;
function grAutoRate(){ return grRate() * 2 * mult('grind') * grBoost(); }
function grCrank(){
  if (GR.jam > 0 || GR.crankCd > 0) return;
  GR.crankCd = .12;
  const d = Math.abs(GR.cur - CEN), z = grZone();
  const res = d <= Math.max(1, z / 3) ? 'perfect' : d <= z ? 'good' : 'miss';
  if (res === 'miss'){
    GR.jam = .8; GR.combo = 0; GR.hit = 'JAM!'; GR.hitT = .8; addMastery('grind', -15); pop(46, 15, 'jammed', 'r'); return;
  }
  GR.combo++; G.gbest = Math.max(G.gbest, GR.combo); G.grinds++; GR.spin = .5;
  const base = res === 'perfect' ? 4 : 2, enz = (GR.enzyme > 0 ? 1.5 : 1) * grBoost();
  const gain = Math.round((base + Math.floor(GR.combo / 5)) * enz * mult('grind') * 10) / 10;
  G.coins += gain; GR.hit = res === 'perfect' ? 'PERFECT!' : 'GOOD'; GR.hitT = .6;
  pop(46, 15, '+' + gain, res === 'perfect' ? 'h' : 'y'); addMastery('grind', res === 'perfect' ? 9 : 6);
}
function grDose(){
  if (GR.doseCd > 0) return;
  GR.doseCd = 1.5;
  const ph = GR.dropT;
  if (ph >= 3.4 && ph <= 4.3){ GR.enzyme = 10; pop(66, 10, 'ENZYME!', 'p'); addMastery('grind', 12); }
  else { pop(66, 10, 'spill', 'r'); }
}
function grStep(dt, viewed){
  if (up('g_motor') > 0){
    GR.autoT += dt * grRate();
    while (GR.autoT >= 1){ GR.autoT -= 1; G.coins += grAutoRate() / Math.max(.01, grRate()); G.grinds++; GR.spin = Math.max(GR.spin, .4); }
  }
  if (!viewed) return;
  GR.crankCd = Math.max(0, GR.crankCd - dt); GR.jam = Math.max(0, GR.jam - dt); GR.hitT = Math.max(0, GR.hitT - dt);
  GR.doseCd = Math.max(0, GR.doseCd - dt); GR.enzyme = Math.max(0, GR.enzyme - dt); GR.spin = Math.max(0, GR.spin - dt);
  GR.dropT = (GR.dropT + dt) % 4.5;
  if (GR.jam <= 0){
    GR.cur += GR.dir * 28 * dt;
    if (GR.cur >= BW - 1){ GR.cur = BW - 1; GR.dir = -1; } if (GR.cur <= 0){ GR.cur = 0; GR.dir = 1; }
  }
  const motor = up('g_motor') > 0;
  GR.phase += dt * (GR.jam > 0 ? 0 : (GR.spin > 0 ? 16 : motor ? 4 + 3 * grRate() : 2));
}
function grClick(cx, cy){
  if (cx >= 64 && cx <= 82 && cy >= 3 && cy <= 13) grDose(); else grCrank();
}
function grDraw(){
  const motor = up('g_motor') > 0;
  put(3, 2, 'COINS', 'd'); put(9, 2, String(Math.floor(G.coins)).padEnd(7), 'h');
  put(19, 2, 'CRANKS', 'd'); put(26, 2, String(G.grinds).padEnd(7), 't');
  put(35, 2, 'COMBO', 'd'); put(41, 2, String(GR.combo).padEnd(4), GR.combo >= 5 ? 'h' : 't'); put(46, 2, `(best ${G.gbest})`, 'd');
  const enzOn = GR.enzyme > 0 || up('g_doser') > 0;
  put(60, 2, 'ENZYME', 'd'); put(67, 2, up('g_doser') > 0 ? `AUTO ×${grBoost().toFixed(2)}` : GR.enzyme > 0 ? `ON ${GR.enzyme.toFixed(0)}s` : 'off', enzOn ? 'p' : 'd');
  if (motor) put(3, 3, `motor income ≈ ${grAutoRate().toFixed(1)} coins/s`, 'g');

  // feed belt + hopper
  belt(6, 33, 5, T, 5);
  for (let k = 0; k < 5; k++) put(6 + ((T * 6 + k * 5.6) % 27), 4, 'Oo0o'[(Math.floor(T * 4) + k) % 4], 'a');
  put(34, 4, '\\' + ' '.repeat(24) + '/', 's'); put(35, 5, '\\' + ' '.repeat(22) + '/', 's');
  for (let k = 0; k < 6; k++) put(37 + (k * 4) % 20, 4 + ((k * 3) % 2), 'O', k % 3 ? 'a' : 'ad');
  // grinder body + blades
  box(34, 6, 28, 6, GR.jam > 0 ? 'r' : 's', true);
  const fr = ['\\|/', '-+-', '/|\\', '-x-'][Math.floor(GR.phase) % 4];
  [40, 48, 56].forEach(bx => { put(bx, 8, fr, GR.jam > 0 ? 'r' : 'k'); put(bx + 1, 7, '▲', 'd'); put(bx + 1, 9, '▼', 'd'); });
  put(36, 6, GR.jam > 0 ? ' JAMMED ' : ' BLADES ', GR.jam > 0 ? 'r' : 'h');
  // pulp output
  const act = GR.spin > 0 || motor ? 1 : 0;
  if (act) for (let k = 0; k < 6; k++) put(42 + k * 3, 12 + ((T * 6 + k * 1.3) % 3), '░▒▓'[k % 3], 'm');
  put(34, 15, '▄'.repeat(28), 's'); put(36, 14, '░▒░▒▓░▒░▒▓░▒░▒▓░▒░▒▓░▒░▒', 'm'); put(64, 14, '◄ "pulp"', 'h');
  // enzyme flask + drop
  put(70, 3, ' ___ ', 's'); put(70, 4, '|   |', 's'); put(70, 5, '/ ~ \\', 'p'); put(69, 6, '/_____\\', 's'); put(68, 7, 'ENZYMES', 'p');
  const ph = GR.dropT;
  if (ph >= 2.9){ const f = (ph - 2.9) / 1.6, y = 8 + f * 4; put(72, y, ':', ph >= 3.4 && ph <= 4.3 ? 'h' : 'p'); }
  put(66, 10, '['); co[10 * W + 66] = 'd'; put(75, 10, '◄ DOSE [E]', 'd'); put(70, 12, '▔▔▔▔▔', 'd');
  if (enzOn) put(62, 10, '◄─ ~~~', 'p');

  // rhythm bar
  const z = grZone();
  put(BX - 8, 17, 'RHYTHM', 'd');
  for (let i = 0; i < BW; i++){
    const d = Math.abs(i - CEN);
    if (d <= Math.max(1, z / 3)) put(BX + i, 17, '█', 'h'); else if (d <= z) put(BX + i, 17, '▓', 'y'); else put(BX + i, 17, '·', 'd');
  }
  put(BX - 1, 17, '[', 's'); put(BX + BW, 17, ']', 's');
  put(BX + Math.round(GR.cur), 18, GR.jam > 0 ? 'x' : '▲', GR.jam > 0 ? 'r' : 'k');
  if (GR.hitT > 0) put(BX + 17, 19, GR.hit.padEnd(10), GR.hit === 'JAM!' ? 'r' : GR.hit === 'GOOD' ? 'y' : 'h');
  if (!mastered('grind')){ if (blink(T, 2)) put(3, 21, '>>> CLICK / SPACE WHEN ▲ IS IN THE GOLD · CATCH THE ENZYME DROP WITH [E] / CLICK FLASK <<<', 'h'); }
  else if (!motor) put(3, 21, 'Auto-Grinder unlocked: buy it below!', 'g');
  else put(3, 21, 'Motor running. You can still crank by hand for bonus coins.', 'g');
  drawMastery('grind', 22);
}

/* ---------- stage registry ---------- */
const MODS = {
  inspect: { step: inspStep, draw: inspDraw, click: inspClick, rate: inspRate },
  grind:   { step: grStep,   draw: grDraw,   click: grClick,   rate: grAutoRate },
};
const stageIdx = id => STAGES.findIndex(s => s.id === id);
const automated = id => up(STAGES[stageIdx(id)].automate) > 0;

/* ---------- frame drawing ---------- */
function draw(){
  clear();
  box(0, 0, W, H, 'd');
  const si = stageIdx(view), s = STAGES[si];
  put(2, 0, ` ${si + 1}/6 · ${s.title.toUpperCase()} ${automated(view) ? '· AUTO' : '· MANUAL'} `, 'h');
  MODS[view].draw();
  for (const p of pops) put(p.x - 1, (view === 'inspect' ? Y : 15) - 1 - p.t * 2.5 + (view === 'inspect' ? 0 : 1), p.text, p.col);
  // stage strip
  const all = STAGES.map(x => x.name).concat(COMING);
  all.forEach((n, i) => {
    const x = 3 + i * 16, st = STAGES[i];
    let line2, c;
    if (!st){ line2 = '(locked)'; c = 'd'; }
    else if (!G.unlocked[st.id]){ line2 = `locked ${st.unlock.cost}¢`; c = 'd'; }
    else if (automated(st.id)){ line2 = 'AUTOMATED ✓'; c = 'g'; }
    else { line2 = 'ACTIVE'; c = 'h'; }
    put(x, 24, `[${i + 1}] ${n}`, st && st.id === view ? 'h' : c); put(x, 25, line2, c);
    if (i < 5) put(x + 13, 24, '►', 'd');
  });
  const nxt = STAGES.find(x => !G.unlocked[x.id]);
  put(3, 26, nxt ? `Next stage: ${nxt.title} — ${nxt.unlock.cost} coins (needs ${defOf(nxt.unlock.needs).title.replace(/^\S+\s/, '')})` : 'More stages coming soon', 'd');
}

/* ---------- tabs ---------- */
const tabs = document.getElementById('tabs');
function renderTabs(){
  tabs.innerHTML = '';
  STAGES.forEach((s, i) => {
    const b = document.createElement('button'), ok = G.unlocked[s.id];
    b.textContent = `${ok ? '' : '🔒 '}${i + 1} ${s.title}`; b.disabled = !ok; b.className = s.id === view ? 'on' : '';
    b.onclick = () => setView(s.id); tabs.appendChild(b);
  });
  COMING.forEach((n, k) => { const b = document.createElement('button'); b.textContent = `🔒 ${STAGES.length + k + 1} ${n === 'FINAL QC' ? 'Final QC' : n[0] + n.slice(1).toLowerCase()}`; b.disabled = true; tabs.appendChild(b); });
}
function setView(id){
  view = id; pops = []; renderTabs(); shopKey = ''; renderShop();
  const s = STAGES[stageIdx(id)]; document.getElementById('title').textContent = `🍋 LEMONADE TYCOON :: STAGE ${stageIdx(id) + 1}`;
  document.getElementById('shopT').textContent = `UPGRADES — ${s.title.toUpperCase()}`;
}

/* ---------- shop (generated from CONFIG) ---------- */
const shop = document.getElementById('shop');
let shopKey = '';
function renderShop(){
  const cards = [];
  const nxt = STAGES.find(x => !G.unlocked[x.id]);
  if (nxt){
    const need = nxt.unlock.needs, ok = up(need) > 0;
    cards.push({ kind: 'unlock', id: nxt.id, title: `🔓 Unlock Stage ${stageIdx(nxt.id) + 1}: ${nxt.title}`, cost: nxt.unlock.cost,
      desc: 'Open the next job in the factory.', lock: ok ? '' : 'Needs ' + defOf(need).title.replace(/^\S+\s/, '') });
  }
  UPGRADES.filter(u => u.stage === view).forEach(d => {
    const l = up(d.id), n = d.levels.length, maxed = l >= n;
    let now = '';
    if (d.show){ const cur = l > 0 ? d.levels[l - 1] : d.base; now = 'Now: ' + d.show(cur) + (maxed ? '' : '  →  Next: ' + d.show(d.levels[l])); }
    cards.push({ kind: 'up', id: d.id, title: d.title + (n > 1 ? `  (Lv ${l}/${n})` : ''), desc: d.desc, now, cost: maxed ? 0 : d.levels[l].cost, owned: maxed, lock: lockReason(d) });
  });
  if (view === STAGES[STAGES.length - 1].id) cards.push({ kind: 'soon', title: '🔒 Stage 3: Maceration', desc: 'The next job is not built yet.' });
  const key = view + JSON.stringify(cards) + (Math.floor(G.coins) >= Math.min(...cards.filter(c => c.cost).map(c => c.cost), 1e9) ? 1 : 0) + cards.map(c => c.cost && G.coins >= c.cost ? 1 : 0).join('');
  if (key === shopKey) return; shopKey = key;
  shop.innerHTML = '';
  cards.forEach(c => {
    const d = document.createElement('div'); d.className = 'card' + (c.owned ? ' owned' : '') + (c.kind === 'unlock' ? ' unlock' : '') + (c.kind === 'soon' ? ' soon' : '');
    d.innerHTML = `<h3>${c.title}</h3><p>${c.desc}</p>` + (c.now ? `<div class="now">${c.now}</div>` : '');
    if (c.kind === 'soon'){ shop.appendChild(d); return; }
    const b = document.createElement('button');
    if (c.owned){ b.textContent = c.kind === 'up' && UPGRADES.find(u => u.id === c.id).levels.length > 1 ? 'MAX' : 'OWNED ✓'; b.disabled = true; }
    else if (c.lock){ b.textContent = c.lock; b.disabled = true; }
    else { b.textContent = `Buy · ${c.cost} 🪙`; b.disabled = G.coins < c.cost; b.onclick = () => (c.kind === 'unlock' ? unlockStage(c.id) : buy(c.id)); }
    d.appendChild(b); shop.appendChild(d);
  });
}
function buy(id){
  const d = defOf(id), l = up(id);
  if (!d || l >= d.levels.length || lockReason(d)) return;
  const cost = d.levels[l].cost; if (G.coins < cost) return;
  G.coins -= cost; G.up[id] = l + 1;
  say(`${d.title} → ${d.levels.length > 1 ? 'Lv ' + (l + 1) : 'online'}!`);
  shopKey = ''; renderShop(); save();
}
function unlockStage(id){
  const s = STAGES[stageIdx(id)];
  if (G.unlocked[id] || G.coins < s.unlock.cost || up(s.unlock.needs) < 1) return;
  G.coins -= s.unlock.cost; G.unlocked[id] = true; save();
  setView(id); say(`🔓 ${s.title} unlocked! Do the job by hand to master it.`);
}

/* ---------- input ---------- */
scr.addEventListener('pointerdown', e => {
  const r = scr.getBoundingClientRect();
  MODS[view].click((e.clientX - r.left) / (r.width / W), (e.clientY - r.top) / (r.height / H));
});
document.addEventListener('keydown', e => {
  if (view !== 'grind') return;
  if (e.code === 'Space'){ e.preventDefault(); grCrank(); }
  if (e.key === 'e' || e.key === 'E') grDose();
});
document.getElementById('reset').onclick = () => {
  if (!confirm('Reset all progress?')) return;
  G = freshState(); pops = []; inspInit(); GR.enzyme = 0; GR.combo = 0; I.combo = 0; setView('inspect'); save(); say('Save reset.');
};

/* ---------- boot ---------- */
inspInit();
const secsAway = Math.min(3600, (Date.now() - G.t) / 1000);
if (secsAway > 30){
  let per = 0; STAGES.forEach(s => { if (G.unlocked[s.id] && automated(s.id)) per += Math.max(0, MODS[s.id].rate()); });
  const away = Math.floor(secsAway * per * .5);
  if (away > 0){ G.coins += away; setTimeout(() => say(`Welcome back! Your factory earned ${away} 🪙 while you were away.`), 100); }
}
fit(); setView('inspect');
let last = performance.now(), acc = 0, saveT = 0;
function frame(now){
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  T += dt;
  STAGES.forEach(s => { if (G.unlocked[s.id]) MODS[s.id].step(dt, s.id === view); });
  pops = pops.filter(p => (p.t += dt) < 1);
  if (msgT > 0 && (msgT -= dt) <= 0) document.getElementById('msg').textContent = '';
  acc += dt; saveT += dt;
  if (acc >= 1 / 20){ acc = 0; draw(); render(); renderShop(); }
  if (saveT > 5){ saveT = 0; save(); }
  requestAnimationFrame(frame);
}
window.addEventListener('beforeunload', save);
window.__T = { get G(){ return G; }, GR, I, buy, unlockStage, setView, grCrank, grDose, inspClick, CEN, get view(){ return view; }, UPGRADES, STAGES };
requestAnimationFrame(frame);
</script>
</body>
