<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemon Orchard</title>
<style>
  :root { --bg:#14180f; --fg:#d8e4c0; --dim:#7d8a68; --lemon:#f5e35a; --water:#5fb4e8; --bad:#e8734f; --good:#7ccf5a; --orange:#f09a3e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.25 "Courier New", monospace; display:flex; justify-content:center; padding:16px; }
  main { width:100%; max-width:640px; }
  h1 { font-size:18px; margin:0 0 8px; color:var(--lemon); letter-spacing:2px; }
  #stats { display:flex; flex-wrap:wrap; gap:4px 18px; border:1px solid var(--dim); padding:6px 10px; margin-bottom:8px; }
  #grid { white-space:pre; font-size:22px; line-height:1.15; border:1px solid var(--dim); padding:10px; overflow-x:auto; user-select:none; }
  .c { cursor:pointer; display:inline-block; width:2.2ch; text-align:center; }
  .cur { background:var(--fg); color:var(--bg) !important; }
  #info { min-height:3.6em; margin:8px 0; color:var(--dim); }
  #log { height:6.5em; overflow:auto; border-top:1px dashed var(--dim); padding-top:6px; color:var(--dim); font-size:14px; }
  #log div:last-child { color:var(--fg); }
  .bar { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  button { background:none; color:var(--fg); border:1px solid var(--dim); font:inherit; padding:8px 10px; cursor:pointer; min-height:40px; }
  button:hover, button:focus-visible { border-color:var(--lemon); color:var(--lemon); outline:none; }
  kbd { color:var(--lemon); }
  .legend { font-size:13px; color:var(--dim); }
</style>
</head>
<body>
<main>
  <h1>🍋 LEMON ORCHARD</h1>
  <div id="stats"></div>
  <div id="grid" aria-label="Orchard grid"></div>
  <div id="info"></div>
  <div class="bar">
    <button data-a="plant"><kbd>P</kbd>lant ($5)</button>
    <button data-a="water">Wat<kbd>E</kbd>r</button>
    <button data-a="harvest"><kbd>H</kbd>arvest</button>
    <button data-a="sell">Sell lemons (<kbd>R</kbd>)</button>
    <button data-a="day"><kbd>␣</kbd> Next day</button>
    <button data-a="reset">New game</button>
  </div>
  <div class="bar shop">
    <span class="legend" style="align-self:center">Automation:</span>
    <button data-a="sprinkler">Sprinkler <kbd>B</kbd> ($25)</button>
    <button data-a="picker">Hire picker ($40)</button>
    <button data-a="truck">Market truck ($60)</button>
    <button data-a="planter">Seedling bot ($50)</button>
    <span class="legend" style="align-self:center">(placed on the selected tile, replacing any tree)</span>
  </div>
  <div class="legend">Move: arrows/WASD or click a tile. &nbsp; <b>.</b> soil &nbsp; <b>s</b> sapling &nbsp; <b>Y</b> young &nbsp; <b>&amp;</b> mature &nbsp; <b>&amp;°</b> fruiting &nbsp; <b>x</b> dead &nbsp; <b style="color:var(--water)">o</b> sprinkler &nbsp; <b style="color:var(--orange)">P</b> picker &nbsp; <b style="color:var(--orange)">T</b> truck &nbsp; <b style="color:var(--orange)">R</b> seedling bot</div>
  <div id="log"></div>
</main>
<script>
const W = 10, H = 10, SAVE = "lemon-orchard-v1";
const SEASONS = ["Spring", "Summer", "Autumn", "Winter"], SEASON_LEN = 30;
const PLANT_COST = 5, LEMON_PRICE = 2;
// Automation
const BUILDINGS = {
  picker: { glyph: "P", desc: "A fruit picker works here." },
  truck: { glyph: "T", desc: "Your market truck is parked here." },
  planter: { glyph: "R", desc: "The seedling bot lives here." },
};
const SPRINKLER_COST = 25, PICKER_COST = 40, PICKER_WAGE = 2, PICKER_CAPACITY = 4;
const TRUCK_COST = 60, TRUCK_CUT = 0.9, PLANTER_COST = 50, PLANTER_PER_DAY = 2;
// Growth thresholds (days of life): sapling -> young -> mature -> fruiting
const STAGE_AT = [0, 4, 9, 14];
const GLYPH = ["s", "Y", "&", "&°"];

let S, cur = { x: 0, y: 0 };

function fresh() {
  return { day: 1, coins: 30, lemons: 0, weather: "sunny", forecast: "sunny",
           pickers: 0, truck: false, planter: false,
           tiles: Array.from({ length: W * H }, () => ({ tree: null, moist: 0.5 })) };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(SAVE)); if (s && s.tiles && s.tiles.length === W * H) return Object.assign(fresh(), s); } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} }

const $ = id => document.getElementById(id);
const t = () => S.tiles[cur.y * W + cur.x];
const season = () => SEASONS[Math.floor((S.day - 1) / SEASON_LEN) % 4];
const stage = tree => { let s = 0; STAGE_AT.forEach((d, i) => { if (tree.age >= d) s = i; }); return s; };

function log(msg) {
  const el = $("log"), d = document.createElement("div");
  d.textContent = msg; el.appendChild(d); el.scrollTop = el.scrollHeight;
  while (el.children.length > 60) el.removeChild(el.firstChild);
}

function render() {
  $("stats").innerHTML =
    `<span>Day ${S.day} (${season()})</span><span>$${S.coins}</span><span>🍋 ${S.lemons}</span>` +
    `<span>Today: ${S.weather}</span><span>Forecast: ${S.forecast}?</span>` +
    `<span>Crew: ${S.pickers} picker${S.pickers === 1 ? "" : "s"}${S.truck ? ", truck" : ""}${S.planter ? ", bot" : ""}</span>`;
  let html = "";
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const tile = S.tiles[y * W + x];
      let ch = ".", color = tile.moist > 0.6 ? "var(--water)" : "var(--dim)";
      if (tile.tree) {
        if (tile.tree.dead) { ch = "x"; color = "var(--bad)"; }
        else {
          ch = GLYPH[stage(tile.tree)];
          color = tile.moist < 0.25 ? "var(--bad)" : tile.moist < 0.4 ? "var(--lemon)" : "var(--good)";
          if (tile.tree.fruit > 0) color = "var(--lemon)";
        }
      }
      if (tile.sprinkler) { ch = "o"; color = "var(--water)"; }
      if (tile.building) { ch = BUILDINGS[tile.building].glyph; color = "var(--orange)"; }
      const on = x === cur.x && y === cur.y;
      html += `<span class="c${on ? " cur" : ""}" data-x="${x}" data-y="${y}" style="color:${color}">${ch}</span>`;
    }
    html += "\n";
  }
  $("grid").innerHTML = html;
  const tile = t();
  let info = `Tile (${cur.x},${cur.y}) — moisture ${Math.round(tile.moist * 100)}%<br>`;
  if (tile.building) info += BUILDINGS[tile.building].desc;
  else if (tile.sprinkler) info += "A sprinkler. Waters this tile and its 8 neighbours every day.";
  else if (!tile.tree) info += "Empty soil.";
  else if (tile.tree.dead) info += "A dead tree. Plant again to clear it.";
  else info += `Tree age ${tile.tree.age}d, ${["sapling", "young tree", "mature tree", "fruiting tree"][stage(tile.tree)]}, ${tile.tree.fruit} lemons ready.`;
  $("info").innerHTML = info;
}

// Puts a building on the selected tile, replacing any tree or sprinkler there.
function place(tile, kind) {
  if (tile.building) { log("There's already a building on this tile."); return false; }
  if (tile.tree) log(tile.tree.dead ? "Cleared a dead tree." : "Cut down a tree to make room.");
  if (tile.sprinkler) log("Removed a sprinkler to make room.");
  tile.tree = null; tile.sprinkler = false; tile.building = kind;
  return true;
}

function act(a) {
  const tile = t();
  if (a === "plant") {
    if (tile.building) return log("A building is in the way.");
    if (tile.sprinkler) return log("A sprinkler is in the way.");
    if (tile.tree && !tile.tree.dead) return log("Already a tree here.");
    if (S.coins < PLANT_COST) return log("Not enough coins.");
    S.coins -= PLANT_COST; tile.tree = { age: 0, fruit: 0, dry: 0, dead: false };
    log("Planted a sapling.");
  } else if (a === "water") {
    tile.moist = Math.min(1, tile.moist + 0.5); log("Watered.");
  } else if (a === "harvest") {
    if (!tile.tree || !tile.tree.fruit) return log("Nothing to harvest.");
    S.lemons += tile.tree.fruit; log(`Picked ${tile.tree.fruit} lemons.`); tile.tree.fruit = 0;
  } else if (a === "sell") {
    if (!S.lemons) return log("No lemons to sell.");
    const price = LEMON_PRICE + (S.weather === "heatwave" ? 1 : 0);
    const gain = S.lemons * price; S.coins += gain; log(`Sold ${S.lemons} lemons for $${gain}.`); S.lemons = 0;
  } else if (a === "sprinkler") {
    if (tile.sprinkler) return log("Already a sprinkler here.");
    if (tile.tree) return log("Sprinklers need empty soil.");
    if (tile.building) return log("A building is in the way.");
    if (S.coins < SPRINKLER_COST) return log("Not enough coins.");
    S.coins -= SPRINKLER_COST; tile.sprinkler = true; log("Built a sprinkler.");
  } else if (a === "picker") {
    if (S.coins < PICKER_COST) return log("Not enough coins.");
    if (!place(tile, "picker")) return;
    S.coins -= PICKER_COST; S.pickers++; log(`Hired a picker (wage $${PICKER_WAGE}/day, picks from up to ${PICKER_CAPACITY} trees a day).`);
  } else if (a === "truck") {
    if (S.truck) return log("You already own a truck.");
    if (S.coins < TRUCK_COST) return log("Not enough coins.");
    if (!place(tile, "truck")) return;
    S.coins -= TRUCK_COST; S.truck = true; log("Market truck bought: lemons are sold each night (10% fee).");
  } else if (a === "planter") {
    if (S.planter) return log("You already own a seedling bot.");
    if (S.coins < PLANTER_COST) return log("Not enough coins.");
    if (!place(tile, "planter")) return;
    S.coins -= PLANTER_COST; S.planter = true; log(`Seedling bot online: replants up to ${PLANTER_PER_DAY} dead trees a day.`);
  } else if (a === "day") return nextDay();
  else if (a === "reset") { if (confirm("Start a new game?")) { S = fresh(); log("A new orchard begins."); } else return; }
  save(); render();
}

function pickWeather() {
  const r = Math.random(), s = season();
  if (s === "Winter" && r < 0.15) return "frost";
  if (s === "Summer" && r < 0.2) return "heatwave";
  return r < 0.3 ? "rain" : "sunny";
}

function nextDay() {
  S.day++; S.weather = S.forecast;
  S.forecast = pickWeather();
  const s = season(), evap = s === "Summer" ? 0.14 : s === "Winter" ? 0.06 : 0.1;
  let deaths = 0, made = 0;
  const sprayed = new Set();
  S.tiles.forEach((tile, i) => {
    if (!tile.sprinkler) return;
    const sx = i % W, sy = Math.floor(i / W);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const nx = sx + dx, ny = sy + dy;
      if (nx >= 0 && nx < W && ny >= 0 && ny < H) sprayed.add(ny * W + nx);
    }
  });
  for (const [i, tile] of S.tiles.entries()) {
    tile.moist = Math.max(0, tile.moist - evap - (S.weather === "heatwave" ? 0.1 : 0));
    if (sprayed.has(i)) tile.moist = Math.max(tile.moist, 0.7);
    if (S.weather === "rain") tile.moist = Math.min(1, tile.moist + 0.5);
    const tr = tile.tree; if (!tr || tr.dead) continue;
    if (tile.moist < 0.15) tr.dry++; else tr.dry = 0;
    if (tile.moist > 0.95 && Math.random() < 0.05) { tr.dead = true; deaths++; continue; } // root rot
    if (tr.dry >= 3 || (S.weather === "frost" && stage(tr) === 0)) { tr.dead = true; deaths++; continue; }
    if (tile.moist >= 0.25) tr.age++;
    if (stage(tr) === 3 && tile.moist >= 0.3 && tr.fruit < 6) {
      const bloom = s === "Winter" ? 0.1 : s === "Spring" ? 0.5 : 0.35;
      if (Math.random() < bloom) { tr.fruit++; made++; }
    }
  }
  const report = automate();
  log(`Day ${S.day}: ${S.weather}.` + (made ? ` ${made} lemons ripened.` : "") + (deaths ? ` ${deaths} tree(s) died.` : ""));
  report.forEach(log);
  if (S.forecast === "frost") log("Almanac: frost warning tonight!");
  save(); render();
}

// Runs at the end of each day; returns log lines.
function automate() {
  const out = [];
  if (S.planter) {
    let n = 0;
    for (const tile of S.tiles) {
      if (n >= PLANTER_PER_DAY || S.coins < PLANT_COST) break;
      if (tile.tree && tile.tree.dead) { tile.tree = { age: 0, fruit: 0, dry: 0, dead: false }; S.coins -= PLANT_COST; n++; }
    }
    if (n) out.push(`Seedling bot replanted ${n} tree(s).`);
  }
  if (S.pickers > 0) {
    const ripe = S.tiles.filter(t => t.tree && !t.tree.dead && t.tree.fruit).sort((a, b) => b.tree.fruit - a.tree.fruit);
    let picked = 0;
    ripe.slice(0, S.pickers * PICKER_CAPACITY).forEach(t => { picked += t.tree.fruit; t.tree.fruit = 0; });
    S.lemons += picked;
    const wages = S.pickers * PICKER_WAGE;
    if (S.coins >= wages) S.coins -= wages;
    else {
      S.pickers--;
      const pt = S.tiles.find(t => t.building === "picker"); if (pt) pt.building = null;
      out.push("A picker quit: you couldn't pay the wages!");
    }
    if (picked) out.push(`Pickers gathered ${picked} lemons (wages $${wages}).`);
  }
  if (S.truck && S.lemons) {
    const price = (LEMON_PRICE + (S.weather === "heatwave" ? 1 : 0)) * TRUCK_CUT;
    const gain = Math.floor(S.lemons * price);
    S.coins += gain; out.push(`Truck sold ${S.lemons} lemons for $${gain}.`); S.lemons = 0;
  }
  return out;
}

function move(dx, dy) { cur.x = (cur.x + dx + W) % W; cur.y = (cur.y + dy + H) % H; render(); }

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  const m = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] }[k];
  if (m) { e.preventDefault(); return move(...m); }
  const a = { p: "plant", e: "water", h: "harvest", r: "sell", b: "sprinkler", " ": "day" }[k];
  if (a) { e.preventDefault(); act(a); }
});
document.addEventListener("click", e => { const b = e.target.closest("button[data-a]"); if (b) act(b.dataset.a); });
$("grid").addEventListener("click", e => {
  const c = e.target.closest(".c"); if (!c) return;
  cur = { x: +c.dataset.x, y: +c.dataset.y }; render();
});

S = load();
log("Welcome! Plant a sapling, keep it watered, and wait for lemons.");
render();
</script>
</body>
</html>
