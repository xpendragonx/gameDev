<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemon Farm</title>
<style>
  body { background: #1b1b12; color: #e8e2a0; margin: 0; padding: 16px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 12px; }
  button { padding: 8px 16px; font: 16px monospace;
           background: #e8e2a0; color: #1b1b12; border: 0; border-radius: 4px; cursor: pointer; }
  button:active { background: #c9c37a; }
  pre  { font: 15px/1.1 monospace; margin: 0 auto; width: max-content; max-width: 100%; overflow-x: auto; }
</style>
</head>
<body>
<pre id="screen"></pre>
<div class="buttons">
  <button id="sell" type="button">Sell lemons</button>
  <button id="chop" type="button">Chop tree (C)</button>
  <button id="hire" type="button"></button>
  <button id="land" type="button"></button>
</div>
<script>
// Lemon farm: ASCII top-down map. Clear debris, plant lemon trees, harvest.
// Every tile is a 4x2 character sprite. Pure logic + text rendering, no DOM,
// so it runs in the browser and in Node.

// The world is a grid of parcels separated by fence lines. You start with one.
const PW = 8, PH = 5;             // parcel interior size in tiles
const PCOLS = 3, PROWS = 2;       // parcels across and down
const W = PCOLS * (PW + 1) + 1;   // map size in tiles (each tile is 4x2 characters)
const H = PROWS * (PH + 1) + 1;
const PARCEL_BASE_COST = 50;      // doubles with every parcel bought

const TILE = {
  GROUND: '.',
  FENCE: '#',
  WEEDS: '"',
  LOG: '=',
  ROCK: 'O',
  STUMP: '%',
  SAPLING: 'i',
  TREE: 'Y',
};

// hits to clear, coins earned
const DEBRIS = {
  [TILE.WEEDS]: { hits: 1, coins: 1, name: 'weeds' },
  [TILE.LOG]:   { hits: 2, coins: 3, name: 'a log' },
  [TILE.ROCK]:  { hits: 3, coins: 2, name: 'a rock' },
  [TILE.STUMP]: { hits: 4, coins: 4, name: 'a stump' },
};

const SAPLING_COST = 5;
const TICK_MS = 250;        // the farm advances one tick every 250 ms (real time)
const GROW_TICKS = 120;     // sapling -> tree: 30 s
const LEMON_TICKS = 32;     // a tree grows one more lemon every 8 s (full in 32 s)
const MAX_LEMONS = 4;
const LEMON_PRICE = 2;      // coins per lemon sold
const CHOP_HITS = { [TILE.SAPLING]: 1, [TILE.TREE]: 3 };
const WOOD_COINS = 3;       // coins from chopping down a full tree

const HARVESTER_BASE_COST = 15;   // doubles with every harvester hired
const HARVESTER_MOVE_TICKS = 2;   // one tile every 0.5 s
const HARVESTER_PICK_TICKS = 4;   // picking a tree takes 1 s

// Each sprite is two strings of exactly 4 characters.
const SPRITE = {
  [TILE.GROUND]:  ['    ', '    '],
  [TILE.FENCE]:   ['####', '####'],
  [TILE.WEEDS]:   [' "\'"', '"\'" '],
  [TILE.LOG]:     ['____', '(__)'],
  [TILE.ROCK]:    [' __ ', '/__\\'],
  [TILE.STUMP]:   ['.==.', '|__|'],
  [TILE.SAPLING]: ['  v ', '  | '],
};
const LOCKED = ['/ / ', ' / /'];                  // land you don't own yet
const AIM = ['[  ]', '[  ]'];            // shown on the cleared ground you are facing
const PLAYER = [' o  ', '/|\\ '];
const HARVESTER = ['\\o/ ', ' /\\ '];

// Lemon slots inside the braces: {  } none, {. } 1, {: } 2, {:.} 3, {::} 4
const LEMON_SLOTS = ['  ', '. ', ': ', ':.', '::'];
const treeSprite = (n) => ['{' + LEMON_SLOTS[n] + '}', ' || '];

// Small seeded RNG (mulberry32) so a farm can be reproduced from its seed.
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Which parcel a tile is inside, or null for a fence line.
function parcelOf(x, y) {
  if (x % (PW + 1) === 0 || y % (PH + 1) === 0) return null;
  return { px: Math.floor(x / (PW + 1)), py: Math.floor(y / (PH + 1)) };
}
const ownedParcel = (g, p) => !!p && g.owned[p.py][p.px];
const ownedCount = (g) => g.owned.flat().filter(Boolean).length;
const allOwned = (g) => ownedCount(g) === PCOLS * PROWS;
const landCost = (g) => (allOwned(g) ? null : PARCEL_BASE_COST * 2 ** (ownedCount(g) - 1));
const touchesOwned = (g, p) =>
  [[0, -1], [0, 1], [-1, 0], [1, 0]].some(([dx, dy]) => {
    const row = g.owned[p.py + dy];
    return !!row && !!row[p.px + dx];
  });

function newGame(seed = Date.now()) {
  const rand = rng(seed);
  const map = [];
  for (let y = 0; y < H; y++) {
    const row = [];
    for (let x = 0; x < W; x++) {
      const p = parcelOf(x, y);
      if (!p) { row.push(TILE.FENCE); continue; }
      // Land further from your starting parcel is more overgrown.
      const f = 1 + 0.4 * (p.px + p.py);
      const r = rand();
      // weeds clump: more likely next to existing weeds
      const nearWeeds = row[x - 1] === TILE.WEEDS || (map[y - 1] && map[y - 1][x] === TILE.WEEDS);
      const weeds = Math.min(nearWeeds ? 0.30 * f : 0.06 * f, 0.5);
      if (r < weeds) row.push(TILE.WEEDS);
      else if (r < weeds + 0.07 * f) row.push(TILE.ROCK);
      else if (r < weeds + 0.11 * f) row.push(TILE.LOG);
      else if (r < weeds + 0.14 * f) row.push(TILE.STUMP);
      else row.push(TILE.GROUND);
    }
    map.push(row);
  }
  // Clear a starting yard so the player never spawns walled in.
  for (let y = 1; y <= 2; y++) for (let x = 1; x <= 2; x++) map[y][x] = TILE.GROUND;
  const owned = Array.from({ length: PROWS }, () => Array(PCOLS).fill(false));
  owned[0][0] = true;

  return {
    seed, map, W, H, owned,
    player: { x: 1, y: 1, face: { x: 1, y: 0 } },
    coins: 0, lemons: 0, saplings: 3,
    step: 0,       // ticks since the game started
    harvesters: [],  // { x, y, cool }
    hits: {},      // "x,y" -> damage dealt to debris so far
    age: {},       // "x,y" -> step the sapling was planted
    trees: {},     // "x,y" -> { n: lemons on the tree, at: step of last change }
    msg: 'Arrow keys / WASD to move. Walk into debris to clear it. P plants, E harvests, C chops a tree, B buys a sapling, H hires a harvester, L buys land.',
  };
}

const key = (x, y) => `${x},${y}`;
const at = (g, x, y) => g.map[y][x];
const harvesterAt = (g, x, y) => g.harvesters.some((h) => h.x === x && h.y === y);
const front = (g) => ({ x: g.player.x + g.player.face.x, y: g.player.y + g.player.face.y });

function growth(g) {
  g.step++;
  for (const k of Object.keys(g.age)) {
    if (g.step - g.age[k] >= GROW_TICKS) {
      const [x, y] = k.split(',').map(Number);
      g.map[y][x] = TILE.TREE;
      g.trees[k] = { n: 0, at: g.step };
      delete g.age[k];
      g.msg = 'A sapling grew into a lemon tree!';
    }
  }
  for (const t of Object.values(g.trees)) {
    if (t.n < MAX_LEMONS && g.step - t.at >= LEMON_TICKS) {
      t.n++; t.at = g.step;
    }
  }
}

function move(g, dx, dy) {
  g.player.face = { x: dx, y: dy };
  const nx = g.player.x + dx, ny = g.player.y + dy;
  const t = at(g, nx, ny);
  if (t === TILE.GROUND) {
    if (harvesterAt(g, nx, ny)) g.msg = 'A harvester is in the way.';
    else { g.player.x = nx; g.player.y = ny; }
  } else if (DEBRIS[t]) {
    const d = DEBRIS[t], k = key(nx, ny);
    g.hits[k] = (g.hits[k] || 0) + 1;
    if (g.hits[k] >= d.hits) {
      delete g.hits[k];
      g.map[ny][nx] = TILE.GROUND;
      g.coins += d.coins;
      g.msg = `Cleared ${d.name}! +${d.coins} coin${d.coins > 1 ? 's' : ''}.`;
    } else {
      g.msg = `Chopping ${d.name}... (${g.hits[k]}/${d.hits})`;
    }
  } else if (t === TILE.FENCE) {
    const beyond = landBeyond(g);
    g.msg = beyond ? `That's the fence. Press L to buy the land beyond it for ${landCost(g)} coins.` : "That's the fence.";
  } else {
    g.msg = 'A lemon tree is in the way. Press E to pick its lemons.';
  }
}

function plant(g) {
  const { x, y } = front(g);
  if (at(g, x, y) !== TILE.GROUND || harvesterAt(g, x, y)) g.msg = 'You can only plant on empty cleared ground in front of you.';
  else if (g.saplings < 1) g.msg = `Out of saplings. Press B to buy one (${SAPLING_COST} coins).`;
  else {
    g.saplings--;
    g.map[y][x] = TILE.SAPLING;
    g.age[key(x, y)] = g.step;
    g.msg = 'Planted a lemon sapling.';
  }
}

function harvest(g) {
  const { x, y } = front(g);
  const tree = g.trees[key(x, y)];
  if (tree && tree.n > 0) {
    g.lemons += tree.n;
    g.msg = `Picked ${tree.n} lemon${tree.n > 1 ? 's' : ''}!`;
    tree.n = 0; tree.at = g.step;
  } else if (tree) g.msg = 'No lemons on that tree yet.';
  else g.msg = 'Nothing to harvest there.';
}

function buySapling(g) {
  if (g.coins >= SAPLING_COST) {
    g.coins -= SAPLING_COST; g.saplings++;
    g.msg = 'Bought a sapling.';
  } else g.msg = `A sapling costs ${SAPLING_COST} coins.`;
}

function sellLemons(g) {
  if (g.lemons < 1) { g.msg = 'You have no lemons to sell.'; return; }
  const earned = g.lemons * LEMON_PRICE;
  g.msg = `Sold ${g.lemons} lemon${g.lemons > 1 ? 's' : ''} for ${earned} coins.`;
  g.coins += earned;
  g.lemons = 0;
}

function chop(g) {
  const { x, y } = front(g);
  const t = at(g, x, y), k = key(x, y), need = CHOP_HITS[t];
  if (!need) { g.msg = 'There is no lemon tree in front of you to chop down.'; return; }
  g.hits[k] = (g.hits[k] || 0) + 1;
  if (g.hits[k] < need) {
    g.msg = `Chopping the tree... (${g.hits[k]}/${need})`;
  } else {
    delete g.hits[k];
    g.map[y][x] = TILE.GROUND;
    if (t === TILE.SAPLING) {
      delete g.age[k];
      g.saplings++;
      g.msg = 'Dug up the sapling. It goes back in your bag.';
    } else {
      const n = g.trees[k].n;
      delete g.trees[k];
      g.lemons += n;
      g.coins += WOOD_COINS;
      g.msg = `Chopped down the tree! +${WOOD_COINS} coins` + (n ? ` and ${n} lemon${n > 1 ? 's' : ''}.` : '.');
    }
  }
}

// The unowned parcel directly behind the fence tile you are facing, if any.
function landBeyond(g) {
  const f = front(g);
  if (at(g, f.x, f.y) !== TILE.FENCE) return null;
  const bx = f.x + g.player.face.x, by = f.y + g.player.face.y;
  if (bx < 0 || by < 0 || bx >= W || by >= H) return null;
  const p = parcelOf(bx, by);
  if (!p || g.owned[p.py][p.px]) return null;
  return { p, fence: f };
}

function buyLand(g) {
  const beyond = landBeyond(g);
  if (!beyond) { g.msg = 'Face a fence that borders unowned land (/ / /) and press L to buy it.'; return; }
  const cost = landCost(g);
  if (g.coins < cost) { g.msg = `That land costs ${cost} coins.`; return; }
  const { p, fence } = beyond;
  g.coins -= cost;
  g.owned[p.py][p.px] = true;
  // Open the shared fence along the whole edge of the new parcel.
  const { x: dx } = g.player.face;
  if (dx !== 0) {
    for (let y = p.py * (PH + 1) + 1; y <= p.py * (PH + 1) + PH; y++)
      if (at(g, fence.x, y) === TILE.FENCE) g.map[y][fence.x] = TILE.GROUND;
  } else {
    for (let x = p.px * (PW + 1) + 1; x <= p.px * (PW + 1) + PW; x++)
      if (at(g, x, fence.y) === TILE.FENCE) g.map[fence.y][x] = TILE.GROUND;
  }
  g.msg = `Bought the land for ${cost} coins. The fence is open.`;
}

const harvesterCost = (g) => HARVESTER_BASE_COST * 2 ** g.harvesters.length;

function hireHarvester(g) {
  const cost = harvesterCost(g);
  if (g.coins < cost) { g.msg = `Hiring a harvester costs ${cost} coins.`; return; }
  // Spawn on the free cleared tile nearest the starting yard.
  let best = null, bestD = Infinity;
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    if (at(g, x, y) !== TILE.GROUND || harvesterAt(g, x, y) || !ownedParcel(g, parcelOf(x, y))) continue;
    if (x === g.player.x && y === g.player.y) continue;
    const d = Math.abs(x - 1) + Math.abs(y - 1);
    if (d < bestD) { bestD = d; best = { x, y }; }
  }
  if (!best) { g.msg = 'No free ground for a harvester to stand on.'; return; }
  g.coins -= cost;
  g.harvesters.push({ ...best, cool: 0 });
  g.msg = `Hired a harvester for ${cost} coins. They pick ripe trees on their own.`;
}

const DIRS4 = [[0, -1], [0, 1], [-1, 0], [1, 0]];
const ripeTreeNear = (g, x, y, claimed) => {
  for (const [dx, dy] of DIRS4) {
    const k = key(x + dx, y + dy);
    const t = g.trees[k];
    if (t && t.n > 0 && !claimed.has(k)) return k;
  }
  return null;
};

// Breadth-first search over free ground to the nearest tile next to a ripe,
// unclaimed tree. Returns { step: first tile to walk to, tree: key } or null.
function findRoute(g, h, claimed) {
  const seen = new Set([key(h.x, h.y)]);
  const queue = [{ x: h.x, y: h.y, first: null }];
  while (queue.length) {
    const cur = queue.shift();
    const tree = ripeTreeNear(g, cur.x, cur.y, claimed);
    if (tree) return { step: cur.first, tree };
    for (const [dx, dy] of DIRS4) {
      const nx = cur.x + dx, ny = cur.y + dy, k = key(nx, ny);
      if (seen.has(k) || at(g, nx, ny) !== TILE.GROUND) continue;
      if (harvesterAt(g, nx, ny) || (nx === g.player.x && ny === g.player.y)) continue;
      seen.add(k);
      queue.push({ x: nx, y: ny, first: cur.first || { x: nx, y: ny } });
    }
  }
  return null;
}

function runHarvesters(g) {
  const claimed = new Set();   // trees another harvester is already heading for
  for (const h of g.harvesters) {
    if (h.cool > 0) { h.cool--; continue; }
    const route = findRoute(g, h, claimed);
    if (!route) continue;                       // nothing ripe: wait
    claimed.add(route.tree);
    if (!route.step) {                          // already standing next to it
      const tree = g.trees[route.tree];
      g.lemons += tree.n;                       // lemons go straight to the stand
      tree.n = 0; tree.at = g.step;
      h.cool = HARVESTER_PICK_TICKS - 1;
    } else {
      h.x = route.step.x; h.y = route.step.y;
      h.cool = HARVESTER_MOVE_TICKS - 1;
    }
  }
}

// One tick of farm time. Call this every TICK_MS.
function tick(g) {
  growth(g);
  runHarvesters(g);
}

function spriteAt(g, x, y) {
  const p = parcelOf(x, y);
  if (p && !g.owned[p.py][p.px]) {
    const cx = p.px * (PW + 1) + 1 + Math.floor(PW / 2), cy = p.py * (PH + 1) + 1 + Math.floor(PH / 2);
    if (x === cx && y === cy && touchesOwned(g, p)) return ['LAND', `$${landCost(g)}`.padEnd(4).slice(0, 4)];
    return LOCKED;
  }
  if (x === g.player.x && y === g.player.y) return PLAYER;
  if (harvesterAt(g, x, y)) return HARVESTER;
  const t = at(g, x, y);
  if (t === TILE.TREE) return treeSprite(g.trees[key(x, y)].n);
  if (t === TILE.GROUND) {
    const f = front(g);
    if (f.x === x && f.y === y) return AIM;
  }
  return SPRITE[t];
}

function render(g) {
  const lines = [];
  for (let y = 0; y < H; y++) {
    let top = '', bottom = '';
    for (let x = 0; x < W; x++) {
      const s = spriteAt(g, x, y);
      top += s[0]; bottom += s[1];
    }
    lines.push(top, bottom);
  }
  lines.push('');
  lines.push(`Coins: ${g.coins}   Lemons: ${g.lemons}   Saplings: ${g.saplings}   Harvesters: ${g.harvesters.length}   Land: ${ownedCount(g)}/${PCOLS * PROWS}   Time: ${Math.floor(g.step * TICK_MS / 1000)}s`);
  lines.push(g.msg);
  lines.push('Tree lemons: {  } 0   {. } 1   {: } 2   {:.} 3   {::} 4     [  ] = tile you are facing');
  return lines.join('\n');
}

const api = { newGame, move, plant, harvest, buySapling, sellLemons, chop, buyLand, landCost, hireHarvester, harvesterCost, tick, render, TILE, DEBRIS, W, H,
              SAPLING_COST, LEMON_PRICE, TICK_MS, GROW_TICKS, LEMON_TICKS, MAX_LEMONS };
if (typeof module !== 'undefined') module.exports = api;
else window.Farm = api;

</script>
<script>
  const params = new URLSearchParams(location.search);
  const game = Farm.newGame(params.has('seed') ? Number(params.get('seed')) : undefined);
  const screen = document.getElementById('screen');
  const landBtn = document.getElementById('land');
  const hireBtn = document.getElementById('hire');
  const draw = () => {
    screen.textContent = Farm.render(game);
    const lc = Farm.landCost(game);
    landBtn.textContent = lc === null ? 'All land owned' : `Buy land (L) - ${lc} coins`;
    hireBtn.textContent = `Hire harvester (H) - ${Farm.harvesterCost(game)} coins`;
  };
  const dirs = {
    ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0],
  };
  addEventListener('keydown', (e) => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (dirs[k]) Farm.move(game, ...dirs[k]);
    else if (k === 'p') Farm.plant(game);
    else if (k === 'e') Farm.harvest(game);
    else if (k === 'c') Farm.chop(game);
    else if (k === 'b') Farm.buySapling(game);
    else if (k === 'h') Farm.hireHarvester(game);
    else if (k === 'l') Farm.buyLand(game);
    else return;
    e.preventDefault();
    draw();
  });
  for (const [id, action] of [['sell', Farm.sellLemons], ['chop', Farm.chop], ['hire', Farm.hireHarvester], ['land', Farm.buyLand]]) {
    document.getElementById(id).addEventListener('click', (e) => {
      action(game);
      e.currentTarget.blur();   // keep keyboard focus on the game, not the button
      draw();
    });
  }
  setInterval(() => { Farm.tick(game); draw(); }, Farm.TICK_MS);   // the farm runs in real time
  draw();
</script>
</body>
</html>
