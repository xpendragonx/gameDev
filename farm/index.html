<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemon Farm</title>
<style>
  body { background: #1b1b12; color: #e8e2a0; margin: 0; padding: 16px; }
  button { display: block; margin: 12px auto 0; padding: 8px 16px; font: 16px monospace;
           background: #e8e2a0; color: #1b1b12; border: 0; border-radius: 4px; cursor: pointer; }
  button:active { background: #c9c37a; }
  pre  { font: 18px/1.1 monospace; margin: 0 auto; width: max-content; max-width: 100%; overflow-x: auto; }
</style>
</head>
<body>
<pre id="screen"></pre>
<button id="sell" type="button">Sell lemons</button>
<script src="farm.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const game = Farm.newGame(params.has('seed') ? Number(params.get('seed')) : undefined);
  const screen = document.getElementById('screen');
  const draw = () => { screen.textContent = Farm.render(game); };
  const dirs = {
    ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0],
  };
  addEventListener('keydown', (e) => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (dirs[k]) Farm.move(game, ...dirs[k]);
    else if (k === 'p') Farm.plant(game);
    else if (k === 'e') Farm.harvest(game);
    else if (k === 'b') Farm.buySapling(game);
    else return;
    e.preventDefault();
    draw();
  });
  document.getElementById('sell').addEventListener('click', (e) => {
    Farm.sellLemons(game);
    e.target.blur();   // keep keyboard focus on the game, not the button
    draw();
  });
  draw();
</script>
</body>
</html>
